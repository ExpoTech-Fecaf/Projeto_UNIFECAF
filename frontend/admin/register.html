<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Cadastrar Funcionário</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main">
      <div class="page-header"><h1>Cadastrar Funcionário</h1></div>
      <div class="card" style="max-width:520px; text-align:left;">
        <form id="register-form">
          <div class="form-group"><label>Username</label><input id="username" required></div>
          <div class="form-group"><label>Senha</label><input type="password" id="password" required></div>
          <div class="form-group"><label>Primeiro Nome</label><input id="first_name" required></div>
          <div class="form-group"><label>Sobrenome</label><input id="last_name" required></div>
          <div class="form-group"><label>Data de Nascimento (dd/mm/YYYY)</label><input id="birth_date" placeholder="15/03/1990" required></div>
          <div class="form-group"><label>CPF (11 dígitos)</label><input id="cpf" maxlength="11" required></div>
          <div class="form-group">
            <label>Cargo</label>
            <select id="role_id">
              <option value="1">Admin</option>
              <option value="2" selected>Funcionário</option>
              <option value="3">Gerente</option>
            </select>
          </div>
          <button type="submit" class="btn btn-primary btn-full">Cadastrar</button>
        </form>
        <div id="alert" class="alert"></div>
      </div>
    </main>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/sidebar.js"></script>
  <script>
    requireAdmin();
    renderSidebar("register");

    document.getElementById("register-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const alert = document.getElementById("alert");
      alert.className = "alert";

      const body = {
        username: document.getElementById("username").value.trim(),
        password: document.getElementById("password").value,
        first_name: document.getElementById("first_name").value.trim(),
        last_name: document.getElementById("last_name").value.trim(),
        birth_date: document.getElementById("birth_date").value.trim(),
        cpf: document.getElementById("cpf").value.trim(),
        role_id: parseInt(document.getElementById("role_id").value),
      };

      const { data } = await apiRequest("/register", { method: "POST", body: JSON.stringify(body) });
      if (data?.success) {
        alert.textContent = `Usuário criado com ID: ${data.user_id}`;
        alert.className = "alert alert-success show";
        e.target.reset();
      } else {
        alert.textContent = data?.message || "Erro ao cadastrar";
        alert.className = "alert alert-error show";
      }
    });
  </script>
</body>
</html>
